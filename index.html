<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Factorization Tree</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        /* Main Card */
        .main-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            animation: fadeInUp 0.6s ease-out;
        }

        /* Control Panel */
        .control-panel {
            padding: 40px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-bottom: 2px solid var(--border-color);
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
            color: var(--text-primary);
        }

        select:hover, input[type="number"]:hover {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 32px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex: 1;
            min-width: 140px;
        }

        #btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: var(--shadow-md);
        }

        #btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        #btn:active {
            transform: translateY(0);
        }

        #clearBtn {
            background: var(--border-color);
            color: var(--text-primary);
        }

        #clearBtn:hover {
            background: #cbd5e1;
        }

        /* Results Section */
        .results-section {
            padding: 40px;
        }

        #resultText {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 30px;
            padding: 20px;
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            opacity: 0;
            animation: slideInLeft 0.5s ease-out forwards;
        }

        #resultText.error {
            background: var(--danger-light);
            border-left-color: var(--danger);
            color: var(--danger);
        }

        #resultText.hidden {
            display: none;
        }

        /* Tree Container */
        #treeContainer {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 15px;
            padding: 40px 20px;
            overflow-x: auto;
            overflow-y: hidden;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tree Styling */
        .tree ul {
            padding-top: 20px;
            position: relative;
            transition: all 0.5s;
            display: flex;
            justify-content: center;
            padding-left: 0;
            list-style: none;
        }

        .tree li {
            float: left;
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 5px 0 5px;
            transition: all 0.5s;
        }

        /* Tree Lines */
        .tree li::before, .tree li::after {
            content: '';
            position: absolute;
            top: 0;
            right: 50%;
            border-top: 2px solid var(--primary);
            width: 50%;
            height: 20px;
        }

        .tree li::after {
            right: auto;
            left: 50%;
            border-left: 2px solid var(--primary);
        }

        .tree li:only-child::after,
        .tree li:only-child::before {
            display: none;
        }

        .tree li:only-child {
            padding-top: 0;
        }

        .tree li:first-child::before,
        .tree li:last-child::after {
            border: none;
        }

        .tree li:last-child::before {
            border-right: 2px solid var(--primary);
            border-radius: 0 5px 0 0;
        }

        .tree li:first-child::after {
            border-radius: 5px 0 0 0;
        }

        .tree ul ul::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            border-left: 2px solid var(--primary);
            width: 0;
            height: 20px;
        }

        /* Animated Node Circles */
        .node {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 1.5rem;
            border: 3px solid var(--primary);
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-md);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0);
            cursor: default;
            position: relative;
            z-index: 1;
        }

        .node:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-lg);
        }

        .node.prime {
            border-color: var(--success);
            background: var(--success-light);
            color: var(--success);
            font-weight: 800;
        }

        .node.prime::after {
            content: '✓';
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--success);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            70% {
                transform: scale(1.15);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stats Footer */
        .stats-footer {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 25px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            text-align: center;
        }

        .stat-item h3 {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .stat-item .value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .stat-item.hidden {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }

            .control-panel {
                padding: 25px;
            }

            .control-group {
                flex-direction: column;
            }

            .form-group {
                width: 100%;
            }

            .button-group {
                width: 100%;
            }

            button {
                min-width: unset;
                width: 100%;
            }

            #treeContainer {
                padding: 25px 15px;
            }

            .tree ul ul {
                gap: 30px;
            }

            .node {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
            }

            .stats-footer {
                padding: 20px;
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 1.1rem;
        }
    </style>
</head>

let currentLang = 'en';

function changeLanguage() {
    currentLang = document.getElementById('langSelect').value;
    updateLanguageUI();
    calculate();
}

function updateLanguageUI() {
    const langData = translations[currentLang];
    document.getElementById('title').innerText = langData.title;
    document.getElementById('subtitle').innerText = langData.subtitle;
    document.getElementById('numInput').placeholder = langData.placeholder;
    document.getElementById('btn').innerText = langData.btn;
    document.getElementById('clearBtn').innerText = langData.clear;
    document.getElementById('emptyMsg').innerText = langData.emptyMsg;
    document.getElementById('stat1-label').innerText = langData.stat1;
    document.getElementById('stat2-label').innerText = langData.stat2;
    document.getElementById('stat3-label').innerText = langData.stat3;
    document.getElementById('stat4-label').innerText = langData.stat4;
}

function isPrime(n) {
    if (n < 2) return false;
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) return false;
    }
    return true;
}

function getSmallestFactor(n) {
    for (let i = 2; i <= Math.sqrt(n); i++) {
        if (n % i === 0) return i;
    }
    return n;
}

let delay = 0;

function buildTreeHTML(num) {
    const isNumPrime = isPrime(num);
    const nodeClass = isNumPrime ? "node prime" : "node";
    const currentDelay = delay;
    delay += 0.2;

    if (isNumPrime) {
        return `<li><span class="${nodeClass}" style="animation-delay: ${currentDelay}s">${num}</span></li>`;
    }

    const factor1 = getSmallestFactor(num);
    const factor2 = num / factor1;

    return `
        <li>
            <span class="${nodeClass}" style="animation-delay: ${currentDelay}s">${num}</span>
            <ul>
                ${buildTreeHTML(factor1)}
                ${buildTreeHTML(factor2)}
            </ul>
        </li>
    `;
}

function getPrimeFactorsList(n) {
    const factors = [];
    let divisor = 2;
    while (n >= 2) {
        if (n % divisor === 0) {
            factors.push(divisor);
            n = n / divisor;
        } else {
            divisor++;
        }
    }
    return factors;
}

function getUniquePrimeFactors(factors) {
    return [...new Set(factors)];
}

function calculate() {
    const num = parseInt(document.getElementById('numInput').value);
    const langData = translations[currentLang];
    const resultDiv = document.getElementById('resultText');
    const treeDiv = document.getElementById('treeContainer');

    if (isNaN(num) || num <= 1) {
        resultDiv.innerText = langData.invalid;
        resultDiv.classList.add('error');
        resultDiv.classList.remove('hidden');
        treeDiv.innerHTML = `<div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>${langData.emptyMsg}</p>
        </div>`;
        clearStats();
        return;
    }

    resultDiv.classList.remove('error');
    const factors = getPrimeFactorsList(num);
    const uniqueFactors = getUniquePrimeFactors(factors);
    
    resultDiv.innerText = langData.res + ": " + factors.join(" × ");
    resultDiv.classList.remove('hidden');

    delay = 0;
    treeDiv.innerHTML = `<ul>${buildTreeHTML(num)}</ul>`;

    // Update stats
    document.getElementById('stat1').innerText = num;
    document.getElementById('stat2').innerText = factors.length;
    document.getElementById('stat3').innerText = factors.length;
    document.getElementById('stat4').innerText = uniqueFactors.length;
}

function clearCalculation() {
    document.getElementById('numInput').value = '';
    document.getElementById('resultText').classList.add('hidden');
    document.getElementById('treeContainer').innerHTML = `<div class="empty-state">
        <div class="empty-state-icon">🌳</div>
        <p>${translations[currentLang].emptyMsg}</p>
    </div>`;
    clearStats();
}

function clearStats() {
    document.getElementById('stat1').innerText = '—';
    document.getElementById('stat2').innerText = '—';
    document.getElementById('stat3').innerText = '—';
    document.getElementById('stat4').innerText = '—';
}

// Initialize on page load
updateLanguageUI();
</script>
